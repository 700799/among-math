<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Among Math — Crew Up &amp; Master Math!</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0b1023;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #game { width: 100vw; height: 100vh; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; color: #cfe3ff; gap: 14px;
        background: #0b1023;
      }
      #loading .pip { font-size: 56px; }
      #loading .txt { font-size: 18px; letter-spacing: 1px; opacity: .8; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">
      <div class="pip">🚀</div>
      <div class="txt">Boarding the ship…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
